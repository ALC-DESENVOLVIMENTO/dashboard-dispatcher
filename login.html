<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Acesso · Bonus Control</title>
    <style>
      :root{--ink:#20212b;--muted:#8b8d9a;--line:#ececf0;--paper:#fafafa;--purple:#7368f0;--red:#dc7272}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}
      .login-shell{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px;box-shadow:0 20px 60px #20212b12}
      .brand{display:flex;align-items:center;gap:12px;font-size:13px;line-height:12px;letter-spacing:1px;margin-bottom:28px}.brand img{width:52px;height:52px;object-fit:contain;border-radius:10px}.brand b{font-weight:800}
      .eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:1px;color:#aaabb5;margin:0 0 8px}.login-shell h1{font-size:24px;letter-spacing:-.7px;margin:0 0 8px}.intro{color:var(--muted);font-size:12px;line-height:18px;margin:0 0 24px}
      label{display:block;color:#666875;font-size:11px;font-weight:700;margin:16px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:7px;padding:12px 13px;font:13px Manrope;color:var(--ink);outline:none}input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7368f01c}
      button{width:100%;border:0;border-radius:7px;padding:13px 15px;margin-top:22px;background:var(--ink);color:#fff;font:700 12px Manrope;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:18px;margin:14px 0 0;color:var(--red);font-size:11px}.foot{border-top:1px solid var(--line);margin-top:22px;padding-top:16px;color:#aaaab3;font-size:10px;line-height:15px}
    </style>
  </head>
  <body>
    <main class="login-shell">
      <div class="brand"><img src="alc-logo.png" alt="ALC Pereira Filho Transportes" /><span>bonus<br /><b>control</b></span></div>
      <p class="eyebrow">ACESSO RESTRITO</p>
      <h1>Entrar no painel</h1>
      <p class="intro">Acesso destinado à Gerência, Coordenação e Dispatchers autorizados.</p>
      <form id="loginForm" novalidate>
        <label for="username">Usuário</label>
        <input id="username" name="username" autocomplete="username" required maxlength="120" />
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" />
        <button id="loginButton" type="submit">Entrar</button>
        <p id="loginMessage" class="message" role="alert" aria-live="polite"></p>
      </form>
      <div class="foot">Os dados e operações do painel são protegidos pelo servidor.</div>
    </main>
    <script src="login.js"></script>
  </body>
</html>
